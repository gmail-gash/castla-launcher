<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Castla WebRTC 시험</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0d12; color: #e8eaf0; font: 16px/1.5 system-ui, sans-serif; }
  main { padding: 16px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .code { font: 700 56px/1.1 ui-monospace, monospace; letter-spacing: .15em; color: #69f0ae; }
  .hint { color: #9aa3b2; margin: 4px 0 16px; }
  .url { font: 600 20px ui-monospace, monospace; word-break: break-all; color: #9ecbff; }
  video { width: 100%; max-height: 62vh; background: #000; border-radius: 8px; display: block; }
  #status { font: 15px/1.6 ui-monospace, monospace; background: #141821; padding: 12px 14px; border-radius: 8px; margin-top: 12px; }
  #status div { display: flex; gap: 12px; }
  #status b { min-width: 9em; color: #9aa3b2; font-weight: 500; }
  .ok { color: #69f0ae; } .bad { color: #ff6b6b; } .wait { color: #ffd166; }
  form { display: flex; gap: 8px; margin: 12px 0; }
  input { font: 700 32px ui-monospace, monospace; width: 8ch; padding: 6px 10px; border-radius: 8px; border: 0; }
  button { font-size: 20px; padding: 8px 18px; border-radius: 8px; border: 0; background: #2d6cdf; color: #fff; }
</style>
</head>
<body>
<main id="app"></main>
<script>
'use strict';
/*
 * WebRTC proof of concept: does the Tesla browser accept a WebRTC stream from the phone over the
 * local network? No STUN/TURN servers are configured, so a connection can only form over
 * local (host) candidates — if video plays, the path is local by construction.
 * Signaling goes through ntfy.sh; only the session descriptions (a few KB) pass through it.
 */
const NTFY = 'https://ntfy.sh';
const TOPIC_PREFIX = 'castla-rtc-';
const CHUNK = 3000;            // ntfy turns bodies over 4096 bytes into attachments
const HELLO_EVERY_MS = 4000;
const HELLO_MAX = 15;          // stay well inside ntfy's anonymous rate limit
const ALPHABET = 'abcdefghjkmnpqrstuvwxyz23456789';

const params = new URLSearchParams(location.search);
const role = params.get('role') === 'phone' ? 'phone' : 'car';
const me = Math.random().toString(36).slice(2, 10);
const app = document.getElementById('app');
const statusRows = new Map();

function randomCode() {
    const bytes = crypto.getRandomValues(new Uint8Array(6));
    return Array.from(bytes, b => ALPHABET[b % ALPHABET.length]).join('');
}

function el(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
}

function setStatus(key, text, cls = '') {
    statusRows.set(key, { text, cls });
    const box = document.getElementById('status');
    if (!box) return;
    box.replaceChildren(...Array.from(statusRows, ([k, v]) =>
        el('div', {}, el('b', { textContent: k }), el('span', { textContent: v.text, className: v.cls }))));
}

/* ---------- signaling over ntfy.sh ---------- */

function publish(topic, payload) {
    const body = JSON.stringify(payload);
    const id = Math.random().toString(36).slice(2, 8);
    const n = Math.max(1, Math.ceil(body.length / CHUNK));
    const sends = [];
    for (let i = 0; i < n; i++) {
        const part = { from: me, id, i, n, d: body.slice(i * CHUNK, (i + 1) * CHUNK) };
        sends.push(fetch(`${NTFY}/${topic}`, { method: 'POST', body: JSON.stringify(part) }));
    }
    return Promise.all(sends);
}

function subscribe(topic, onMessage, onOpen) {
    const partial = new Map();
    const es = new EventSource(`${NTFY}/${topic}/sse`);
    es.onopen = () => { setStatus('중계 서버', '연결됨', 'ok'); onOpen && onOpen(); };
    es.onerror = () => setStatus('중계 서버', '재연결 중…', 'wait');
    es.onmessage = (ev) => {
        let part;
        try {
            const event = JSON.parse(ev.data);
            if (event.event && event.event !== 'message') return;
            part = JSON.parse(event.message);
        } catch (_) { return; }
        if (!part || part.from === me || typeof part.d !== 'string') return;
        const key = `${part.from}:${part.id}`;
        const parts = partial.get(key) || new Array(part.n);
        parts[part.i] = part.d;
        partial.set(key, parts);
        if (parts.filter(p => p !== undefined).length !== part.n) return;
        partial.delete(key);
        let msg;
        try { msg = JSON.parse(parts.join('')); } catch (_) { return; }
        onMessage(msg, part.from);
    };
    return es;
}

/* ---------- WebRTC helpers ---------- */

function newPeer() {
    // No iceServers on purpose: only local (host) candidates, so any connection is local.
    return new RTCPeerConnection({ iceServers: [] });
}

function gathered(pc) {
    if (pc.iceGatheringState === 'complete') return Promise.resolve();
    return new Promise(resolve => {
        const done = () => { if (pc.iceGatheringState === 'complete') resolve(); };
        pc.addEventListener('icegatheringstatechange', done);
        setTimeout(resolve, 3000);  // host candidates arrive at once; don't wait on a stalled gatherer
    });
}

async function describeRoute(pc) {
    const stats = await pc.getStats();
    let pair;
    stats.forEach(s => { if (s.type === 'transport' && s.selectedCandidatePairId) pair = stats.get(s.selectedCandidatePairId); });
    if (!pair) stats.forEach(s => { if (s.type === 'candidate-pair' && s.nominated && s.state === 'succeeded') pair = s; });
    if (!pair) return null;
    const fmt = c => c ? `${c.candidateType} / ${c.protocol} / ${c.address || c.ip || '(가려짐)'}` : '?';
    return `내쪽 ${fmt(stats.get(pair.localCandidateId))}  ↔  상대 ${fmt(stats.get(pair.remoteCandidateId))}`;
}

function watch(pc, onConnected) {
    pc.addEventListener('connectionstatechange', async () => {
        const state = pc.connectionState;
        const cls = state === 'connected' ? 'ok' : (state === 'failed' || state === 'closed') ? 'bad' : 'wait';
        setStatus('WebRTC 연결', state, cls);
        if (state === 'connected') {
            setStatus('경로', (await describeRoute(pc)) || '확인 불가', 'ok');
            onConnected && onConnected();
        }
        if (state === 'failed') setStatus('경로', '로컬 직통 연결 실패 — 테슬라가 막았거나 같은 네트워크가 아님', 'bad');
    });
}

/* ---------- phone: send the camera ---------- */

async function runPhone() {
    let code = params.get('c');
    if (!code) {
        code = randomCode();
        history.replaceState(null, '', `?role=phone&c=${code}`);
    }
    const topic = TOPIC_PREFIX + code;
    const carUrl = `${location.origin}${location.pathname}?c=${code}`;
    const preview = el('video', { autoplay: true, muted: true, playsInline: true });
    app.append(
        el('h1', { textContent: '폰 (보내는 쪽)' }),
        el('div', { className: 'code', textContent: code }),
        el('p', { className: 'hint', textContent: '테슬라 브라우저에서 아래 주소를 열거나, 시험 페이지에 위 코드를 입력하세요.' }),
        el('div', { className: 'url', textContent: carUrl }),
        el('p'), preview, el('div', { id: 'status' }));
    setStatus('역할', '폰 (카메라 송출)');

    let stream;
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
        });
    } catch (e) {
        setStatus('카메라', `사용 불가: ${e.name}`, 'bad');
        return;
    }
    preview.srcObject = stream;
    setStatus('카메라', '켜짐', 'ok');
    setStatus('테슬라', '기다리는 중…', 'wait');

    let pc = null, peerId = null;
    subscribe(topic, async (msg, from) => {
        if (msg.type === 'hello') {
            if (pc && peerId === from && pc.connectionState === 'connected') return;
            if (pc) pc.close();
            peerId = from;
            pc = newPeer();
            stream.getTracks().forEach(t => pc.addTrack(t, stream));
            watch(pc);
            await pc.setLocalDescription(await pc.createOffer());
            await gathered(pc);
            await publish(topic, { type: 'offer', sdp: pc.localDescription.sdp });
            setStatus('테슬라', '발견 — 연결 제안 보냄', 'wait');
        } else if (msg.type === 'answer' && pc && from === peerId && !pc.remoteDescription) {
            await pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp });
            setStatus('테슬라', '응답 받음 — 연결 중', 'wait');
        }
    });
}

/* ---------- car: receive and report ---------- */

async function browserFacts() {
    setStatus('브라우저', (navigator.userAgent.match(/Chrome\/[\d.]+/) || [navigator.userAgent.slice(0, 60)])[0]);
    setStatus('WebRTC 지원', typeof RTCPeerConnection === 'function' ? '있음' : '없음',
        typeof RTCPeerConnection === 'function' ? 'ok' : 'bad');
    let lna = '지원 안 함 (옛 버전)';
    try { lna = (await navigator.permissions.query({ name: 'local-network-access' })).state; } catch (_) {}
    setStatus('로컬 네트워크 권한', lna);
}

async function reportVideo(pc) {
    const stats = await pc.getStats();
    stats.forEach(s => {
        if (s.type !== 'inbound-rtp' || s.kind !== 'video') return;
        const codec = stats.get(s.codecId);
        const fps = s.framesPerSecond != null ? Math.round(s.framesPerSecond) : '?';
        setStatus('영상', `${codec ? codec.mimeType.replace('video/', '') : '?'}  ${s.frameWidth || '?'}x${s.frameHeight || '?'}  ${fps}fps  (받은 프레임 ${s.framesDecoded || 0})`, 'ok');
    });
}

async function runCar() {
    const code = (params.get('c') || '').toLowerCase();
    app.append(el('h1', { textContent: '테슬라 (받는 쪽)' }));
    if (!/^[a-z0-9]{6}$/.test(code)) {
        const input = el('input', { maxLength: 6, autocomplete: 'off', placeholder: '코드' });
        const form = el('form', {}, input, el('button', { type: 'submit', textContent: '연결' }));
        form.onsubmit = (e) => { e.preventDefault(); location.search = `?c=${input.value.trim().toLowerCase()}`; };
        app.append(el('p', { className: 'hint', textContent: '폰 화면에 뜬 6자리 코드를 입력하세요.' }), form, el('div', { id: 'status' }));
        await browserFacts();
        return;
    }

    const topic = TOPIC_PREFIX + code;
    const video = el('video', { autoplay: true, muted: true, playsInline: true });
    app.append(video, el('div', { id: 'status' }));
    setStatus('역할', `테슬라 (코드 ${code})`);
    await browserFacts();

    let pc = null, connected = false, hellos = 0, timer = null;
    const sayHello = () => {
        if (connected || hellos >= HELLO_MAX) {
            clearInterval(timer);
            if (!connected) setStatus('폰', '응답 없음 — 폰 페이지가 열려 있는지 확인 후 새로고침', 'bad');
            return;
        }
        hellos++;
        publish(topic, { type: 'hello' });
        setStatus('폰', `찾는 중… (${hellos}/${HELLO_MAX})`, 'wait');
    };

    subscribe(topic, async (msg) => {
        if (msg.type !== 'offer') return;
        if (pc) pc.close();
        pc = newPeer();
        pc.ontrack = (e) => { video.srcObject = e.streams[0] || new MediaStream([e.track]); };
        watch(pc, () => {
            connected = true;
            setStatus('폰', '연결됨', 'ok');
            setInterval(() => reportVideo(pc), 2000);
        });
        await pc.setRemoteDescription({ type: 'offer', sdp: msg.sdp });
        await pc.setLocalDescription(await pc.createAnswer());
        await gathered(pc);
        await publish(topic, { type: 'answer', sdp: pc.localDescription.sdp });
        setStatus('폰', '연결 제안 받음 — 응답 보냄', 'wait');
    }, () => {
        if (timer) return;
        sayHello();
        timer = setInterval(sayHello, HELLO_EVERY_MS);
    });
}

(role === 'phone' ? runPhone : runCar)().catch(e => setStatus('오류', `${e.name}: ${e.message}`, 'bad'));
</script>
</body>
</html>
